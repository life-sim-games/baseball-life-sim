<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>戦力外通告 〜這い上がりの野球人生〜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #efe9db;
        --bg2: #e7dfcc;
        --panel: #fbf8f0;
        --panel2: #f3eddc;
        --ink: #211d16;
        --ink2: #5c5546;
        --line: #c9bfa5;
        --red: #b3111b;
        --red-d: #8f0d15;
        --gold: #9a7b1e;
        --green: #2e6b34;
        --blue: #274b73;
        --bar-bg: #ddd3ba;
        --shadow: 0 2px 10px rgba(60, 48, 20, .14);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17150f;
          --bg2: #100e09;
          --panel: #221f16;
          --panel2: #2a2619;
          --ink: #ece5d0;
          --ink2: #b3a888;
          --line: #4a4230;
          --red: #e0453a;
          --red-d: #ff6a5e;
          --gold: #d3ab3e;
          --green: #7bc47f;
          --blue: #8db4dd;
          --bar-bg: #3a3524;
          --shadow: 0 2px 10px rgba(0, 0, 0, .5);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        line-height: 1.65;
        min-height: 100vh;
      }
      .mincho { font-family: "Zen Old Mincho", "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; }
      #app { max-width: 760px; margin: 0 auto; padding: 14px 14px 60px; }

      /* ---------- title screen ---------- */
      .title-wrap { text-align: center; padding: 26px 4px 8px; }
      .title-paper {
        background: #faf5e8; color: #1c1a15;
        border: 3px double #1c1a15;
        padding: 22px 16px 18px; box-shadow: var(--shadow);
        transform: rotate(-.4deg);
      }
      .title-paper .kicker { font-size: 12px; letter-spacing: .35em; color: #8f0d15; font-weight: 700; }
      .title-paper h1 {
        font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
        font-weight: 900; font-size: clamp(30px, 8.4vw, 52px);
        margin: 8px 0 2px; line-height: 1.15; letter-spacing: .02em;
      }
      .title-paper .sub { font-family: "Zen Old Mincho", serif; font-size: clamp(15px, 4.4vw, 21px); font-weight: 700; }
      .title-paper .rule { border-top: 2px solid #1c1a15; border-bottom: 1px solid #1c1a15; height: 4px; margin: 12px 0; }
      .title-lead { font-size: 14px; text-align: left; margin: 14px 2px; color: var(--ink); }
      .title-lead b { color: var(--red); }

      /* ---------- generic panels ---------- */
      .panel {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 16px; margin: 14px 0; box-shadow: var(--shadow);
      }
      .panel h2 {
        font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
        font-size: 20px; margin: 0 0 8px; line-height: 1.35;
      }
      .panel h3 { font-size: 15px; margin: 14px 0 6px; }
      .story { font-size: 15px; }
      .story p { margin: 0 0 10px; }
      .muted { color: var(--ink2); font-size: 13px; }
      .small { font-size: 12.5px; }

      /* ---------- status bar ---------- */
      #statusbar {
        position: sticky; top: 0; z-index: 30;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 12px; margin-bottom: 12px; box-shadow: var(--shadow);
      }
      #statusbar .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
      #statusbar .who .nm { font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: 19px; }
      #statusbar .who .meta { font-size: 12.5px; color: var(--ink2); }
      #statusbar .who .badge {
        font-size: 11px; font-weight: 700; border: 1.5px solid var(--ink);
        padding: 0 7px; border-radius: 20px; line-height: 1.7;
      }
      #statusbar .who .badge.hot { border-color: var(--red); color: var(--red); }
      .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; margin-top: 8px; }
      @media (min-width: 560px) { .statgrid { grid-template-columns: repeat(6, 1fr); } }
      .stat .lb { font-size: 10.5px; color: var(--ink2); letter-spacing: .05em; }
      .stat .vl { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .bar { height: 5px; background: var(--bar-bg); border-radius: 3px; overflow: hidden; margin-top: 2px; }
      .bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
      .bar i.low { background: var(--red); }
      .bar i.mid { background: var(--gold); }
      .bar i.hi { background: var(--green); }
      .money-neg { color: var(--red); }

      /* ---------- actions ---------- */
      .actions { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 4px; }
      button.act {
        appearance: none; width: 100%; text-align: left; cursor: pointer;
        background: var(--panel); color: var(--ink);
        border: 1.5px solid var(--ink); border-radius: 10px;
        padding: 13px 15px; font: inherit; box-shadow: var(--shadow);
        transition: transform .06s ease, background .15s ease;
      }
      button.act:hover { background: var(--panel2); }
      button.act:active { transform: scale(.985); }
      button.act .t { font-weight: 800; font-size: 16px; display: block; }
      button.act .d { font-size: 12.5px; color: var(--ink2); display: block; margin-top: 2px; }
      button.act.primary { background: var(--ink); color: var(--panel); }
      button.act.primary .d { color: inherit; opacity: .75; }
      button.act.red { border-color: var(--red); color: var(--red); }
      button.act.red .d { color: var(--ink2); }
      button.act:disabled { opacity: .45; cursor: not-allowed; }
      button.act:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

      /* ---------- player card ---------- */
      .pcard { border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); margin: 14px 0; }
      .pcard .head { background: var(--ink); color: var(--panel); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
      .pcard .head .nm { font-family: "Zen Old Mincho", serif; font-size: 26px; font-weight: 900; }
      .pcard .head .tm { font-size: 13px; opacity: .85; }
      .pcard .body { padding: 14px 16px; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 14px; }
      .kv dt { color: var(--ink2); font-size: 12.5px; padding-top: 2px; }
      .kv dd { margin: 0; font-weight: 600; }
      .titles-box { border: 1px dashed var(--gold); border-radius: 8px; padding: 8px 12px; margin-top: 12px; background: var(--panel2); }
      .titles-box .lb { font-size: 11px; letter-spacing: .2em; color: var(--gold); font-weight: 800; }
      .titles-box .tt { font-weight: 700; font-size: 14.5px; }

      table.stats { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; margin: 8px 0 4px; }
      table.stats th, table.stats td { padding: 4px 5px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
      table.stats th { color: var(--ink2); font-weight: 600; font-size: 11.5px; border-bottom: 2px solid var(--ink); }
      table.stats td:first-child, table.stats th:first-child { text-align: left; }
      table.stats tr.total td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: none; }
      table.stats tr.peak td { background: var(--panel2); }
      .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      @media (max-width: 560px) {
        table.stats { font-size: 11.5px; }
        table.stats th, table.stats td { padding: 4px 3px; }
      }

      .reason-box { border-left: 5px solid var(--red); background: var(--panel2); padding: 10px 14px; margin-top: 12px; border-radius: 0 8px 8px 0; }
      .reason-box .lb { font-size: 11px; letter-spacing: .2em; color: var(--red); font-weight: 800; }
      .reason-box .tx { font-weight: 700; font-size: 15px; }

      /* ---------- event / log ---------- */
      .event-card { border: 1.5px solid var(--ink); border-radius: 10px; padding: 14px 16px; background: var(--panel); margin: 14px 0; box-shadow: var(--shadow); }
      .event-card .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .15em; border: 1.5px solid currentColor; border-radius: 4px; padding: 0 7px; line-height: 1.8; margin-bottom: 6px; }
      .tag.injury { color: var(--red); } .tag.money { color: var(--gold); }
      .tag.family { color: var(--blue); } .tag.life { color: var(--green); }
      .finance { font-variant-numeric: tabular-nums; font-size: 14px; }
      .finance .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted var(--line); }
      .finance .row.ttl { border-bottom: none; border-top: 2px solid var(--ink); font-weight: 800; margin-top: 4px; padding-top: 6px; }

      /* ---------- newspaper overlay ---------- */
      #paper-veil {
        position: fixed; inset: 0; z-index: 100; display: none;
        background: rgba(12, 10, 6, .72); overflow-y: auto; padding: 18px 10px 40px;
      }
      #paper-veil.open { display: block; }
      .paper {
        max-width: 680px; margin: 0 auto; background: #faf5e7; color: #191712;
        padding: 20px 20px 16px; box-shadow: 0 14px 50px rgba(0,0,0,.55);
        border: 1px solid #99917a; transform: rotate(-.3deg);
        animation: paperin .35s ease;
      }
      @keyframes paperin { from { opacity: 0; transform: translateY(16px) rotate(-.3deg); } to { opacity: 1; transform: translateY(0) rotate(-.3deg); } }
      @media (prefers-reduced-motion: reduce) { .paper { animation: none; } }
      .paper .mast { text-align: center; border-bottom: 4px double #191712; padding-bottom: 8px; }
      .paper .mast .pn { font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: clamp(30px, 8vw, 44px); letter-spacing: .12em; line-height: 1.1; }
      .paper .mast .pn span { color: #b3111b; }
      .paper .dateline { display: flex; justify-content: space-between; font-size: 11.5px; border-bottom: 1px solid #191712; padding: 4px 2px; font-weight: 600; }
      .paper h2.headline {
        font-family: "Zen Old Mincho", "Shippori Mincho B1", serif; font-weight: 900;
        font-size: clamp(27px, 7.4vw, 44px); line-height: 1.28; margin: 14px 0 4px; letter-spacing: .01em;
      }
      .paper h2.headline.good { color: #b3111b; }
      .paper .subhead { font-family: "Zen Old Mincho", serif; font-weight: 700; font-size: clamp(14px, 4vw, 18px); border-top: 1px solid #191712; border-bottom: 1px solid #191712; padding: 6px 2px; margin: 8px 0 12px; }
      .paper .article { font-size: 14px; line-height: 1.9; text-align: justify; }
      @media (min-width: 620px) { .paper .article { columns: 2; column-gap: 26px; column-rule: 1px solid #c9c0a4; } }
      .paper .comment { border: 2px solid #191712; padding: 10px 14px; margin: 14px 0 6px; background: #f3ecd7; }
      .paper .comment .lb { font-size: 11px; font-weight: 800; letter-spacing: .2em; color: #b3111b; }
      .paper .comment .tx { font-family: "Shippori Mincho B1", serif; font-weight: 600; font-size: 15.5px; margin-top: 3px; }
      .paper .foot { font-size: 10.5px; color: #6d6650; border-top: 1px solid #c9c0a4; margin-top: 12px; padding-top: 6px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .paper button.close-paper {
        appearance: none; width: 100%; margin-top: 14px; cursor: pointer;
        background: #191712; color: #faf5e7; border: none; border-radius: 6px;
        font: inherit; font-weight: 800; font-size: 16px; padding: 13px;
      }
      .paper button.close-paper:active { transform: scale(.99); }

      /* ---------- ending ---------- */
      .rank-badge {
        font-family: "Zen Old Mincho", serif; font-weight: 900;
        width: 92px; height: 92px; border-radius: 50%; margin: 6px auto;
        display: flex; align-items: center; justify-content: center;
        font-size: 52px; border: 4px double currentColor;
      }
      .rank-S { color: #b3111b; } .rank-A { color: var(--gold); }
      .rank-B { color: var(--blue); } .rank-C { color: var(--ink2); } .rank-D { color: var(--ink2); }
      .freq { text-align: center; font-size: 17px; font-weight: 800; margin: 8px 0; }
      .freq b { color: var(--red); font-size: 22px; }
      details.src { margin: 16px 0; font-size: 12.5px; color: var(--ink2); }
      details.src summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 13px; }
      details.src li { margin-bottom: 4px; }
      .end-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .end-grid .cell { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel2); text-align: center; }
      .end-grid .cell .n { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
      .end-grid .cell .l { font-size: 11px; color: var(--ink2); }
      /* ---------- past players archive ---------- */
      .rank-chip { font-family: "Zen Old Mincho", serif; font-weight: 900; width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 25px; border: 3px double currentColor; flex: none; }
      .mini-btn { appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; margin-top: 12px; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink); }
      .mini-btn.on { background: var(--ink); color: var(--panel); }
      .mini-btn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
      table.cmp th, table.cmp td { text-align: left; white-space: normal; }
      table.cmp td:first-child { color: var(--ink2); font-size: 11.5px; white-space: nowrap; }
      table.cmp td { font-weight: 600; }

      .toast { text-align: center; font-weight: 800; padding: 10px; border-radius: 8px; margin: 12px 0; border: 1.5px solid var(--ink); background: var(--panel2); }
      .toast.good { border-color: var(--red); color: var(--red); }

      /* ---------- share ---------- */
      .share-text {
        white-space: pre-wrap; word-break: break-word; text-align: left;
        border: 1px dashed var(--line); background: var(--panel2);
        border-radius: 8px; padding: 10px 12px; font-size: 13.5px; line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="statusbar" style="display:none"></div>
      <main id="main"></main>
    </div>

    <div id="paper-veil" role="dialog" aria-modal="true" aria-label="スポーツ新聞">
      <div class="paper" id="paper-sheet"></div>
    </div>

    <script>
    "use strict";
    /* ============================================================
       戦力外通告 〜這い上がりの野球人生〜
       難易度の基準（実データ）:
       - NPB進路調査2025（対象169人）: 支配下続行 10人(5.9%) / 育成 48人(28.4%)
       - 合同トライアウト合格率 3〜8%（ほぼ育成契約）
       - 同一球団の育成再契約が最大の受け皿（支配下戦力外の約18〜28%）
       - 独立リーグ月給は公式レンジ10〜40万円、実態の平均像は約15万円
       ============================================================ */

    /* ---------------- utility ---------------- */
    var SIM = false;               // テスト用サイレントモード
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function chance(p) { return Math.random() < p; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function fmt(n) { return Math.round(n).toLocaleString("ja-JP"); }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
    function money(n) { // 万円表記
      if (Math.abs(n) >= 10000) return (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1).replace(/\.0$/, "") + "億円";
      return fmt(n) + "万円";
    }

    /* ---------------- data ---------------- */
    var TEAMS = [
      { full: "読売ジャイアンツ", short: "巨人", league: "セ" },
      { full: "阪神タイガース", short: "阪神", league: "セ" },
      { full: "中日ドラゴンズ", short: "中日", league: "セ" },
      { full: "広島東洋カープ", short: "広島", league: "セ" },
      { full: "東京ヤクルトスワローズ", short: "ヤクルト", league: "セ" },
      { full: "横浜DeNAベイスターズ", short: "DeNA", league: "セ" },
      { full: "福岡ソフトバンクホークス", short: "ソフトバンク", league: "パ" },
      { full: "北海道日本ハムファイターズ", short: "日本ハム", league: "パ" },
      { full: "東北楽天ゴールデンイーグルス", short: "楽天", league: "パ" },
      { full: "埼玉西武ライオンズ", short: "西武", league: "パ" },
      { full: "千葉ロッテマリーンズ", short: "ロッテ", league: "パ" },
      { full: "オリックス・バファローズ", short: "オリックス", league: "パ" }
    ];
    var IND_LEAGUES = [
      { name: "四国アイランドリーグplus", teams: ["愛媛マンダリンパイレーツ", "香川オリーブガイナーズ", "徳島インディゴソックス", "高知ファイティングドッグス"] },
      { name: "ルートインBCリーグ", teams: ["新潟アルビレックス・ベースボール・クラブ", "信濃グランセローズ", "群馬ダイヤモンドペガサス", "埼玉武蔵ヒートベアーズ", "茨城アストロプラネッツ", "栃木ゴールデンブレーブス", "神奈川フューチャードリームス", "富山GRNサンダーバーズ", "石川ミリオンスターズ", "福井ネクサスエレファンツ"] },
      { name: "九州アジアリーグ", teams: ["火の国サラマンダーズ", "大分B-リングス", "北九州下関フェニックス", "宮崎サンシャインズ"] },
      { name: "日本海リーグ", teams: ["富山サンダーバーズ", "石川ミリオンスターズ", "福井ユナイテッド", "滋賀ハイジャンプス"] }
    ];
    var FARM_TEAMS = ["オイシックス新潟アルビレックスBC", "くふうハヤテベンチャーズ静岡"];
    var OVERSEAS = [
      { country: "台湾", league: "CPBL（中華職業棒球大聯盟）", teams: ["中信兄弟", "統一ライオンズ", "富邦ガーディアンズ", "楽天モンキーズ", "味全ドラゴンズ", "台鋼ホークス"], pay: [900, 1600],
        level: "中堅 ― 元NPB選手の成功例が多く、日本人選手が馴染みやすい", slot: "外国人枠はあるが、結果が出なければ夏場に入れ替えも", npb: "近い ― NPBのスカウトが定期的に視察し、復帰の足がかりになりやすい", perfMod: 1, cutBase: 0.18, backMul: 1.5, req: 52 },
      { country: "韓国", league: "KBOリーグ", teams: ["LGツインズ", "KTウィズ", "SSGランダース", "NCダイノス", "斗山ベアーズ", "KIAタイガース", "ロッテ・ジャイアンツ", "サムスン・ライオンズ", "ハンファ・イーグルス", "キウム・ヒーローズ"], pay: [1200, 2600],
        level: "高 ― 打高傾向で投手は特に高い水準を要求される", slot: "外国人枠は最大3人。結果が出ないとシーズン途中で即クビ級の厳しさ", npb: "中 ― 活躍すればNPBスカウトも注目。逆に失敗の印象も残りやすい", perfMod: -5, cutBase: 0.34, backMul: 1.0, req: 62 },
      { country: "メキシコ", league: "LMB（リーガ・メヒカーナ）", teams: ["メキシコシティ・レッドデビルズ", "モンテレイ・サルタンズ", "ユカタン・ライオンズ", "ティファナ・ブルズ", "キンタナロー・タイガース"], pay: [700, 1400],

      siblings = siblings.filter(function (v, i, a) { return a.indexOf(v) === i; });
      var statusLabel = status === "married" ? (kids > 0 ? "既婚・子ども" + kids + "人" : "既婚・子どもなし") : status === "dating" ? "交際相手あり（未婚）" : "独身";
      var livingLabel = living === "実家" ? "実家暮らし" : living;
      return { status: status, kids: kids, living: living, father: father, mother: mother, parentsClose: parentsClose, siblings: siblings, label: statusLabel + "／" + livingLabel };
    }
    function refreshFamilyLabel() {
      // 家族構成が途中で変わったときに label を genFamily と同じ表記で再計算する
      var f = G.p && G.p.family;
      if (!f) return;
      var statusLabel = f.status === "married" ? (f.kids > 0 ? "既婚・子ども" + f.kids + "人" : "既婚・子どもなし") : f.status === "dating" ? "交際相手あり（未婚）" : "独身";
      var livingLabel = f.living === "実家" ? "実家暮らし" : f.living;

    }
    function supportContacts() {
      // その選手に「実際にいる」連絡相手だけを返す。いない人物は絶対に含めない
      var f = G.p.family, list = [];
      function add(who, kind) { list.push({ who: who, kind: kind }); }
      if (f) {
        if (f.status === "married") { add("妻", "family"); if (f.kids > 0) add("妻と子ども", "family"); }
        else if (f.status === "dating") add("恋人", "family");
        if (f.parentsClose) {
          if (f.father && f.mother) add("両親", "family");
          if (f.father) add("父親", "family");
          if (f.mother) add("母親", "family");
        }
        (f.siblings || []).forEach(function (s) { add(s, "family"); });
      }
      add("高校時代の恩師", "mentor");
      add("元チームメイトの先輩", "mentor");
      add("後輩", "junior");
      add("地元の友人", "friend");
      add("代理人", "agent");
      add("ファン", "fan");

    }
    function genSeasonLineFor(p, lv, ageNow) {

    function totalsOf(seasons, type) {
      var t = { g: 0, w: 0, l: 0, sv: 0, hld: 0, ip: 0, er: 0, ab: 0, h: 0, hr: 0, rbi: 0, sb: 0 };
      seasons.forEach(function (s) {
        t.g += s.g || 0;
        if (s.kind === "P") { t.w += s.w; t.l += s.l; t.sv += s.sv; t.hld += s.hld; t.ip += s.ip; t.er += s.era * s.ip / 9; }
        else { t.ab += s.ab; t.h += s.h; t.hr += s.hr; t.rbi += s.rbi; t.sb += s.sb; }
      });
      t.ip = Math.round(t.ip * 10) / 10;
      t.era = t.ip > 0 ? Math.round(t.er / t.ip * 9 * 100) / 100 : 0;
      t.avg = t.ab > 0 ? Math.round(t.h / t.ab * 1000) / 1000 : 0;
      return t;
    }
    function fmtAvg(a) { return a >= 1 ? a.toFixed(3) : ("." + String(Math.round(a * 1000)).padStart(3, "0")); }

    function failScreen(title, bodyHtml, nextLabel) {
      // 失敗しても自動で進まない。必ず次の行動を自分で選ばせる
      var html = '<div class="panel"><h2>' + esc(title) + '</h2><div class="story">' + bodyHtml + "</div></div>";
      show(html, [{ label: nextLabel || "次の行動を選ぶ", cls: "primary", fn: function () { offseason(); } }]);
    }

    function doTryout() {
      G.triedTryoutThisWinter = true;
      var fat = clamp(1 - 0.09 * G.attempts, 0.45, 1); G.attempts++;
      G.month = 11;
      var p = G.p;
      var form = rnd(-8, 10); // 当日の調子
      var score = p.ability * 0.65 + p.condition * 0.2 + p.record * 0.25 + form - ageDecline();
      // 実績ライン: 標準的な選手で合格率5〜8%前後、好選手で上昇
      var passP = (clamp(0.012 + Math.pow(Math.max(0, score - 50) / 62, 1.83) * 0.84, 0.008, 0.5) * marketFactor() + 0.012) * fat;
      var dayFormTxt = form > 5 ? "当日の調子は上々だった" : form < -4 ? "当日の調子は今ひとつだった" : "当日の調子はまずまずだった";
      if (chance(passP)) {
        var shihai = chance(clamp(0.04 + (score - 70) * 0.006, 0.02, 0.2)); // 支配下はごく稀
        var team = pick(candidateTeams());
        if (shihai) {
          signNPB(team, true, "トライアウトから支配下契約をつかんだ");
        } else {
          signIkusei(team, "トライアウト合格");
        }
      } else {
        p.mental = clamp(p.mental - 6, 5, 99);
        failScreen("トライアウト、不合格",
          "<p>11月、" + ri(33, 59) + "人の選手が集まった合同トライアウト。" + esc(dayFormTxt) + "が、数日後――連絡は来なかった。</p>" +
          "<p>近年のトライアウトでNPB契約をつかむのは参加者の3〜8%。しかも、その多くは「最終確認の場」として事前に目星をつけられていた選手だと言われる。現実は、やはり厳しい。</p>" +
          "<p>落ち込んでいる暇はない。冬はまだ終わっていない。次の手を打とう。</p>");
      }
    }

    function doIkuseiOffer() {
      var p = G.p;
      G.month = 12;
      var score = p.record * 0.4 + p.ability * 0.45 + p.fame * 0.15 - ageDecline() * 1.2;
      var fat2 = clamp(1 - 0.09 * G.attempts, 0.45, 1); G.attempts++;
      var ageMul = p.age <= 33 ? 1 : clamp(1 - (p.age - 33) * 0.16, 0.12, 1);
      // 最大の受け皿：同一球団の育成再契約（実データで支配下戦力外の約18〜28%）
      // ただし同一球団との古巣育成再契約は1キャリア1回まで。使い切った球団はこのルートの対象から外し、
      // その分の確率は他球団ルートに足さない（他球団・他の進路は通常どおり）
      var sameTeam = TEAMS.filter(function (t) { return t.full === G.excludeTeam; })[0] || p.team;
      var sameP = canFurusatoIkusei(sameTeam.full) ? clamp(0.10 + (score - 40) * 0.004, 0.04, 0.35) * (0.5 + 0.5 * ageMul) * fat2 : 0;
      var otherP = clamp(0.05 + (score - 42) * 0.0045, 0.015, 0.32) * marketFactor() * ageMul * fat2;
      var r = Math.random();
      if (r < sameP) {
        // 同一球団の育成再契約は「直近に通告した球団」自身が相手（他球団経路とは別枠の本線ルート）
        signIkusei(sameTeam, "古巣と育成で再契約");
      } else if (r < sameP + otherP) {
        var team = pick(candidateTeams());
        // 育成が中心だが、実績十分なら稀に支配下
        if (chance(clamp((score - 78) * 0.015, 0, 0.16))) signNPB(team, false, "他球団と支配下契約");
        else signIkusei(team, "他球団と育成契約");
      } else {
        p.mental = clamp(p.mental - 4, 5, 99);
        failScreen("オファーは届かなかった",
          "<p>代理人が12球団に売り込みを続けたが、支配下はおろか育成契約のオファーも届かなかった。「年齢」と「来季の稼働見通し」がネックになったようだ。</p>" +
          "<p>それでもNPBの扉が完全に閉ざされたわけではない。独立リーグや海外で結果を残せば、シーズン中の補強や翌年のドラフト・テストで声がかかることもある。</p>");
      }
    }

    function signIkusei(team, how) {
      if (how && how.indexOf("古巣") >= 0) {
        // 古巣の育成再契約は同一球団につき1回まで。選出側でも除外しているが、ここでも二重に防ぐ
        if (!canFurusatoIkusei(team.full)) {
          failScreen("古巣からの育成オファーはなかった",
            "<p>" + esc(team.short) + "とは、すでに一度、戦力外から育成で再契約している。同じ球団が育成で拾い直すのは一度きりだ。</p>" +
            "<p>この線はもうない。他の球団、他の進路で活路を探そう。</p>");
          return;
        }
        recordFurusatoIkusei(team.full);
      }
      G.attempts = 0;
      G.envPerfMod = 0; G.offerScoutMul = 1;
      var p = G.p;
      G.phase = "ikusei"; G.teamName = team.full; G.yearsInEnv = 0; G.ikuseiGoodStreak = 0;
      G.envLabel = "育成契約（" + team.short + "）";
      G.contractSalary = 240;
      G.month = 12;
      if (!G.npbReturnBest) G.npbReturnBest = "ikusei";
      if (G.releases >= 1 && team.full !== p.team.full) { /* 移籍 */ }
      newspaper({
        date: dateStr(), good: true,
        headline: p.surname + "、" + team.short + "と育成契約！",
        subhead: how + "――年俸" + money(G.contractSalary) + "、背番号は3桁。再起への第一歩",
        body: [
          team.full + "は" + dateStr() + "、元" + p.team.short + "の" + p.name + "選手（" + p.age + "）と育成契約を結んだと発表した。",
          "戦力外通告を受けた選手の進路として最も多いのが、この育成契約だ（NPB進路調査では約28%）。ただし支配下登録の枠は70人。シーズン中の支配下昇格を勝ち取れるかは、ファームでの結果次第となる。",
          "育成選手の最低年俸は240万円。かつて最高" + money(p.peakSalary) + "を稼いだ男の、再出発としては厳しい条件だ。"
        ],
        comment: "拾ってもらえたことに感謝しかない。支配下に戻ることしか考えていません"
      }, function () { startSeasonIntro(); });
    }

      G.attempts = 0;

          "NPBの進路調査（2025年）では、戦力外・引退選手169人のうち支配下で現役を続けられたのは10人、わずか5.9%だった。" + p.surname + "はその狭き門をこじ開けたことになる。",

    function doIndependent() {
      var p = G.p;
      G.month = 1;
      // オファーの数と質は実績・注目度・年齢で変わる
      var n = 2 + (p.record >= 58 ? 1 : 0) + (p.fame >= 55 ? 1 : 0) - (p.age >= 35 ? 1 : 0);
      n = clamp(n, 1, 4);
      // 実在の独立リーグ球団から候補を抽選
      var pool = [];
      IND_LEAGUES.forEach(function (lg) { lg.teams.forEach(function (t) { pool.push({ team: t, league: lg.name }); }); });
      var offers = [];
      var profiles = [
        { kind: "強豪チーム", payAdd: ri(3, 6), opp: "出場機会は競争が激しい", att: "注目度は高く、NPBスカウトの視察も多い", perfMod: -2, scoutMul: 1.5 },
        { kind: "中堅チーム", payAdd: ri(0, 3), opp: "主力候補として出場機会は多め", att: "注目度はそこそこ。結果を残せば話が広がる", perfMod: 2, scoutMul: 1.0 },
        { kind: "若手中心のチーム", payAdd: ri(-1, 1), opp: "レギュラー確約に近い厚遇", att: "注目度は低め。数字でアピールするしかない", perfMod: 6, scoutMul: 0.6 }
      ];
      for (var i = 0; i < n && pool.length; i++) {
        var idx = Math.floor(Math.random() * pool.length);
        var cand = pool.splice(idx, 1)[0];
        var prof = profiles[Math.min(i, profiles.length - 1)];
        if (i >= profiles.length) prof = profiles[ri(0, profiles.length - 1)];
        var pay = clamp(ri(10, 14) + prof.payAdd + (p.record > 65 ? ri(0, 4) : 0), 8, 24);
        offers.push({ team: cand.team, league: cand.league, kind: prof.kind, pay: pay, opp: prof.opp, att: prof.att, perfMod: prof.perfMod, scoutMul: prof.scoutMul });
      }
      // 紹介順はシャッフル（良い条件が先とは限らない）
      offers.sort(function () { return Math.random() - 0.5; });
      var html = '<div class="panel"><h2>独立リーグ ― チーム別オファー</h2>' +
        '<p class="story">代理人のもとに、独立リーグの球団から' + offers.length + '件のオファーが届いた。給料、出場機会、チームの強さ、スカウトの目――条件は球団ごとに違う。どこでプレーするかが、NPB復帰の確率そのものを左右する。</p>' +
        '<p class="muted">独立リーグの月給は公式レンジで10〜40万円、実態の平均像は約15万円。支給はシーズン中のみが基本です。</p></div>';
      var acts = offers.map(function (o) {
        return {
          label: o.team + "（" + o.league + "）",
          sub: o.kind + "／月給" + o.pay + "万円／" + o.opp + "／" + o.att,
          fn: function () { signIndependent(o); }
        };
      });
      acts.push({ label: "やめて、他の進路を考える", fn: function () { offseason(); } });
      show(html, acts);
    }

      G.monthlyPay = o.pay;

        '<p class="story">あなたの総合評価は <strong>' + Math.round(score) + '</strong>（実績 ' + Math.round(p.record) + ' × 0.6 ＋ 能力 ' + Math.round(p.ability) + ' × 0.4）。この評価で声がかかったリーグが、下の選択肢に出ている。レベル、年俸、外国人枠の厳しさ、NPB復帰への近さはリーグごとにまったく違う。目先の条件を取るか、復帰への近さを取るか――行き先の選択そのものが勝負だ。</p>' +
        (canMLB ? '<p class="story" style="font-weight:700;color:var(--red)">さらに、MLB球団から「マイナー契約なら」という打診も届いている。夢の大博打に挑むかどうかも含め、選べるのは実力と実績のある選手だけだ。</p>' : "") +

    function signOverseas(ov) {

      var overseasBody = [

          "言葉も食文化も違う異国でのプレーは容易ではない。だが、ここで結果を残せば、NPBのスカウトは必ず見ている。"
        ];
      if (leftHomeOverseas) overseasBody.push("実家暮らしだった" + p.surname + "は、この契約を機に実家を離れ、" + ov.country + "で一人暮らしを始める。生活のすべてを自分で担いながらの挑戦となる。");
      newspaper({
        date: dateStr(), good: true,
        headline: p.surname + "、" + ov.country + "挑戦を決断！",
        subhead: ov.league + "・" + team + "と契約。年俸" + money(G.contractSalary) + "（推定）",
        body: overseasBody,
        comment: "環境のせいにはしない。結果を出して、必ず日本に戻ってきます"
      }, function () { startSeasonIntro(); });
    }

    function doMLB() {
      var p = G.p;
      var team = pick(MLB_TEAMS);
      G.attempts = 0; G.phase = "mlb"; G.mlbRoute = true; G.teamName = team; G.yearsInEnv = 0; G.ikuseiGoodStreak = 0;
      G.mlbLevel = p.record >= 74 ? "AA" : "A";
      G.mlbReached = false;
      G.contractSalary = ri(280, 360); // マイナーの薄給（円換算の年額イメージ）
      G.envPerfMod = -2; G.offerScoutMul = 1;
      G.envLabel = "マイナーリーグ（" + team + "傘下" + G.mlbLevel + "）";
      G.month = 1;
      G.milestones.push(G.year + "年 MLB挑戦（" + team + "とマイナー契約）");
      var leftHomeMLB = false;
      if (p.family && p.family.living === "実家") { p.family.living = "一人暮らし"; refreshFamilyLabel(); leftHomeMLB = true; }
      var mlbBody = [
          "元" + p.team.full + "の" + p.name + "選手（" + p.age + "）が、MLBの" + team + "とマイナー契約を結び、渡米することが決まった。",
          "マイナーリーガーの給料は安く、生活は決して楽ではない。それでも、AAAを経てMLBの40人枠に届けば、世界最高峰の舞台が待っている。元NPBの戦力外選手がたどり着いた例は、ほぼ皆無に近い。",
          "失敗すれば、年齢と貯金を失って帰国する。それを承知で海を渡る覚悟が、この挑戦には要る。"
        ];
      if (leftHomeMLB) mlbBody.push("実家暮らしだった" + p.surname + "は、渡米に合わせて実家を離れ、アメリカで一人暮らしを始める。言葉も文化も違う土地で、生活も野球も一人で切り開いていく。");
      newspaper({
        date: dateStr(), good: true,
        headline: p.surname + "、MLB挑戦！ マイナー契約で渡米",
        subhead: team + "傘下" + G.mlbLevel + "からスタート。薄給と遠征バスの生活が始まる",
        body: mlbBody,
        comment: "後悔だけはしたくない。ダメならダメで、自分の野球人生に決着がつく"
      }, function () { startSeasonIntro(); });
    }

    function doCorporate() {
      var p = G.p;
      G.month = 12;
      // オファーの数と質は実績・注目度・年齢で変わる
      var n = 2 + (p.record >= 60 ? 1 : 0) - (p.age >= 36 ? 1 : 0);
      n = clamp(n, 1, 3);
      var pool = CORP_TEAMS.slice();
      var profiles = [
        { kind: "強豪（都市対抗常連）", pay: [540, 680], opp: "出場機会は競争が激しいが、都市対抗で目立てばスカウトの目に留まる", att: 2.0, perfMod: -1, cutAdd: 0, stable: "経営は安定" },
        { kind: "中堅チーム", pay: [470, 560], opp: "主力候補。即戦力として期待される", att: 1.0, perfMod: 2, cutAdd: 0.02, stable: "経営は安定" },
        { kind: "中小・地方のチーム", pay: [420, 500], opp: "レギュラー確約級の厚遇。チームの顔になる", att: 0.5, perfMod: 5, cutAdd: 0.06, stable: "業績次第で部の存続が揺らぐことも" }
      ];
      var offers = [];
      for (var i = 0; i < n && pool.length; i++) {
        var idx = Math.floor(Math.random() * pool.length);
        var team = pool.splice(idx, 1)[0];
        var prof = profiles[Math.min(i, profiles.length - 1)];
        if (i >= profiles.length) prof = profiles[ri(0, profiles.length - 1)];
        offers.push({ team: team, kind: prof.kind, salary: Math.round(rnd(prof.pay[0], prof.pay[1]) / 10) * 10, opp: prof.opp, att: prof.att, perfMod: prof.perfMod, cutAdd: prof.cutAdd, stable: prof.stable });
      }
      offers.sort(function () { return Math.random() - 0.5; });
      var html = '<div class="panel"><h2>社会人野球 ― チーム別オファー</h2>' +
        '<p class="story">企業チームから' + offers.length + '件の誘いが届いた。強豪は注目度が高い代わりに競争が激しく、中小チームは厚遇でも部の存続リスクがある。生活の安定と、最後のアピールの場――何を優先するかだ。</p></div>';
      var acts = offers.map(function (o) {
        return {
          label: o.team + "（" + o.kind + "）",
          sub: "年収" + money(o.salary) + "前後／" + o.opp + "／" + o.stable,
          fn: function () { signCorporate(o); }
        };
      });
      acts.push({ label: "やめて、他の進路を考える", fn: function () { offseason(); } });
      show(html, acts);
    }

    function signCorporate(o) {
      var p = G.p;
      G.attempts = 0; G.phase = "corporate"; G.teamName = o.team; G.yearsInEnv = 0; G.ikuseiGoodStreak = 0;
      G.contractSalary = o.salary;
      G.envPerfMod = o.perfMod; G.offerScoutMul = 1;
      G.corpAttention = o.att; G.corpCutAdd = o.cutAdd;
      G.envLabel = "社会人野球（" + o.team + "）";
      G.month = 1;
      newspaper({
        date: dateStr(), good: false,
        headline: "元" + p.team.short + "・" + p.surname + "、社会人野球へ",
        subhead: o.team + "に内定。午前は社業、午後は練習の二重生活が始まる",
        body: [
          "元" + p.team.full + "の" + p.name + "選手（" + p.age + "）が、社会人野球の" + o.team + "に入社することが分かった。",
          "戦力外選手の進路として社会人野球は約11%（NPB進路調査）。生活は安定する一方、NPB復帰の事例は若手のドラフト指名などに限られ、年齢を重ねるほど扉は閉ざされていく。",
          "都市対抗野球での活躍が、最後のアピールの場になる。"
        ],
        comment: "野球を続けられる環境に感謝したい。都市対抗で結果を出します"
      }, function () { startSeasonIntro(); });
    }

    /* ---------------- season engine ---------------- */
    function envIntroText() {
      var p = G.p;
      switch (G.phase) {
        case "npb": return { t: G.teamName + " ― 支配下の1年", b: "背番号をもらった。だが支配下の枠は70人、結果が出なければ秋にまた通告が待つ。1軍の舞台で生き残れるか。" };
        case "ikusei": return { t: G.teamName + " ― 育成選手の1年", b: "背番号は3桁。支配下登録の期限は7月末。ファームで圧倒的な成績を残し、昇格を勝ち取るしかない。" };
        case "ind": return { t: G.teamName + "（" + G.indLeague + "） ― 独立リーグの1年", b: "月給" + G.monthlyPay + "万円、支給はシーズン中のみ。観客数百人の球場でも、NPBのスカウトはどこかで見ている。圧倒的な成績が唯一の言語だ。" };
        case "overseas": return { t: G.teamName + "（" + G.overseas.country + "） ― 海外挑戦の1年", b: "外国人枠は結果がすべて。結果が出なければシーズン途中で契約解除もある世界。だが活躍すればNPB復帰の噂が立つ。" };
        case "corporate": return { t: G.teamName + " ― 社会人野球の1年", b: "午前中は社業、午後は練習。生活は安定したが、NPBのスカウトの視線は年々遠ざかる。都市対抗が最大の舞台だ。" };
        case "farm": return { t: G.teamName + " ― ファーム参加球団の1年", b: "NPBファーム公式戦に出場できる新しい受け皿。イースタン／ウエスタン・リーグでNPBの若手と対戦し、存在を証明する。" };
        case "mlb": return G.mlbLevel === "MLB"
          ? { t: G.teamName + " ― MLBの1年", b: "ついに立った世界最高峰の舞台。だがMLBの椅子は世界中の猛者が狙っている。結果を残し続けなければ、すぐにマイナー行き、あるいは解雇だ。" }
          : { t: G.teamName + "傘下" + G.mlbLevel + " ― マイナーリーグの1年", b: "薄給、長距離バス移動、英語の飛び交うロッカー。昇格の階段は" + (G.mlbLevel === "A" ? "AA→AAA→MLB" : G.mlbLevel === "AA" ? "AAA→MLB" : "MLB") + "。結果を残し続けた者だけが、次の階へ呼ばれる。" };
      }
      return { t: "", b: "" };
    }

    function startSeasonIntro() {
      G.month = 3;
      var info = envIntroText();
      var p = G.p;
      var html = '<div class="panel"><h2>' + G.year + '年シーズン ― ' + esc(info.t) + '</h2>' +
        '<p class="story">' + esc(info.b) + '</p>' +
        '<p class="muted">現在の能力：実力' + Math.round(p.ability) + '／コンディション' + Math.round(p.condition) + '／メンタル' + Math.round(p.mental) + '</p></div>';
      show(html, [{ label: "シーズン開始", cls: "primary", fn: function () { runSeasonEvents(0); } }]);
    }

    // シーズン中イベントを2つ挟んでから結果へ
    var seasonCtx = null;
    function runSeasonEvents(step) {
      var evCount = 2;
      if (step >= evCount) { seasonResult(); return; }
      var ev = pickSeasonEvent(step);
      if (!ev) { runSeasonEvents(step + 1); return; }
      seasonCtx = { step: step };
      var html = '<div class="event-card"><span class="tag ' + ev.tagCls + '">' + esc(ev.tag) + '</span>' +
        '<h2 class="mincho" style="font-size:19px;margin:2px 0 8px">' + esc(ev.title) + '</h2>' +
        '<div class="story">' + ev.body + "</div></div>";
      show(html, ev.choices.map(function (c) {
        return { label: c.label, sub: c.sub || "", cls: c.cls || "", fn: function () { c.apply(); if (typeof c.result === "function") c.result = c.result(); afterEvent(ev, c); } };
      }));
    }
    function afterEvent(ev, choice) {
      var html = '<div class="panel"><h2>' + esc(ev.title) + '</h2><div class="story">' + choice.result + "</div></div>";
      show(html, [{ label: "シーズンを続ける", cls: "primary", fn: function () { runSeasonEvents(seasonCtx.step + 1); } }]);
    }

    function pickSeasonEvent(step) {
      var p = G.p;
      var pool = [];
      // 怪我（年齢・故障歴・コンディションで確率上昇）
      var injP = 0.16 + (p.injuryProne ? 0.14 : 0) + Math.max(0, p.age - 31) * 0.012 + (p.condition < 45 ? 0.1 : 0);
      if (chance(injP)) pool.push(injuryEvent());
      var lifeEv = lifeStageEvent();
      if (lifeEv) pool.push(lifeEv);
      if (p.savings < 900 && G.phase !== "npb") pool.push(moneyEvent());
      if (G.phase === "ind") pool.push(indLifeEvent());
      pool.push(familyEvent(), mentorEvent(), formEvent(), teamEvent());
      // 重複回避しつつランダムに1つ
      return pick(pool);
    }

    function lifeStageEvent() {
      // 結婚・出産など人生の節目。条件と確率ゲートを通った場合のみ1つ返す
      var p = G.p, f = p.family;
      if (!f) return null;
      // stageYear 未設定＝キャリア開始時からそのステージにいる選手。「十分な期間が経っている」とみなす
      var stageOk = (f.stageYear == null || G.year - f.stageYear >= 1);
      if (f.status === "single") {
        if (p.age >= 23 && p.age <= 40 && chance(0.30)) return datingStartEvent();
      } else if (f.status === "dating") {
        if (stageOk && chance(0.45)) return marriageEvent();
      } else if (f.status === "married") {
        if ((f.kids || 0) < 2 && stageOk && p.age <= 42 && chance(0.35)) return childbirthEvent();
      }
      return null;
    }

    function datingStartEvent() {
      var p = G.p;
      return {
        tag: "人生", tagCls: "life", title: "新しい出会い",
        body: "<p>オフのある日、知人の紹介で食事をする機会があった。野球の話になると目を輝かせて聞いてくれる人で、気づけば時間を忘れて話し込んでいた。地元に帰ったとき偶然再会した同級生のことも頭をよぎる。プロ野球選手の生活は不規則で、先の見えない世界だ。それでも――誰かと人生を分かち合いたい気持ちが、静かに芽生えていた。</p>",
        choices: [
          { label: "交際を始める", sub: "一人の時間は減るが、支えてくれる人が増える",
            apply: function () { var f = p.family; f.status = "dating"; f.stageYear = G.year; refreshFamilyLabel(); p.mental = clamp(p.mental + 3, 0, 99); },
            result: "<p>交際が始まった。練習後の短い電話や、休日のささやかな時間が、心の支えになっていく。野球に打ち込む理由が、また一つ増えた気がした。</p>" },
          { label: "今は野球に集中する", sub: "生き残ることが先決。出会いはまたいつか",
            apply: function () { p.mental = clamp(p.mental + 1, 0, 99); },
            result: "<p>丁重に気持ちだけ受け取り、野球に集中することにした。後悔はない――はずだ。今はグラウンドで結果を出すことが、何よりの答えになる。</p>" }
        ]
      };
    }

    function marriageEvent() {
      var p = G.p, f = p.family;
      var longTime = (f.stageYear == null); // キャリア開始時から交際している相手かどうか
      var body = longTime
        ? "<p>長く交際してきた相手と、将来のことを真剣に話す機会が増えてきた。野球人生の先が見えない時期も、相手はずっとそばで支えてくれた。この人となら、どんな場所でもやっていける――そんな確信がある。プロポーズの言葉が、自然と胸に浮かんできた。</p>"
        : "<p>交際を続けてきた相手と、将来のことを真剣に話す機会が増えてきた。不規則で先の見えないプロ野球選手の生活を、相手は理解し、支えてくれている。この先も一緒に歩んでいきたい――プロポーズの言葉が、自然と胸に浮かんできた。</p>";
      function marryChoice(label, sub, cost, fameUp, mentalUp, sceneText) {
        var c = { label: label, sub: sub, result: "" };
        c.apply = function () {
          p.savings = Math.max(0, p.savings - cost);
          f.status = "married";
          f.stageYear = G.year;
          if (f.living === "実家" || f.living === "一人暮らし") f.living = "妻と同居";
          refreshFamilyLabel();
          G.milestones.push(G.year + "年 結婚");
          if (fameUp) p.fame = clamp(p.fame + fameUp, 0, 99);
          p.mental = clamp(p.mental + mentalUp, 0, 99);
          c.result = "<p>" + sceneText + "</p>" + ((G.phase === "npb" || p.fame >= 50) ? "<p>結婚の知らせはスポーツ紙でも報じられ、祝福の声が届いた。</p>" : "");
        };
        return c;
      }
      return {
        tag: "人生", tagCls: "life", title: "プロポーズ",
        body: body,
        choices: [
          marryChoice("盛大な結婚式を挙げる", "費用 約150万円 ― たくさんの人に祝福してもらう", 150, 3, 5, "ホテルの披露宴には、チームメイトや関係者が大勢駆けつけてくれた。スピーチでは笑いと涙が交じり、忘れられない一日になった。"),
          marryChoice("家族だけのささやかな式にする", "費用 約50万円 ― 温かく、アットホームな式に", 50, 0, 4, "両家の家族だけを招いた、小さくて温かい式になった。派手さはないが、大切な人たちにしっかりと報告できた。"),
          marryChoice("入籍だけ済ませる", "費用 約10万円 ― 派手さより、二人の実を取る", 10, 0, 3, "二人で役所に婚姻届を出してきた。それだけのことなのに、帰り道の景色が少し違って見えた。今日から家族だ。"),
          { label: "まだ結婚は考え直す", sub: "気持ちはあるが、今はタイミングではない",
            apply: function () {},
            result: "<p>プロポーズは見送った。今の自分には、まだ野球で示すべきことがある。相手は少し寂しそうに、それでも頷いてくれた。</p>" }
        ]
      };
    }

    function childbirthEvent() {
      var p = G.p, f = p.family;
      var n = (f.kids || 0) + 1; // 開始時の子どもの数を含めた通し番号
      function doBirth() {
        f.kids = (f.kids || 0) + 1;
        f.stageYear = G.year;
        p.savings = Math.max(0, p.savings - 30);
        f.living = "家族と同居";
        refreshFamilyLabel();
        G.milestones.push(G.year + "年 第" + n + "子誕生");
      }
      return {
        tag: "人生", tagCls: "life", title: "第" + n + "子誕生",
        body: "<p>待望の知らせが届いた。妻が無事に出産し、元気な赤ちゃんが生まれたという。母子ともに健康。小さな命の写真を見ていると、胸がいっぱいになった。守るべきものが、また一人増えた。</p>",
        choices: [
          { label: "出産に立ち会う（1試合休む）", sub: "試合を1つ休むが、一生に一度の瞬間に立ち会う",
            apply: function () { doBirth(); seasonCtx.perfMod = (seasonCtx.perfMod || 0) - 2; p.mental = clamp(p.mental + 6, 0, 99); },
            result: "<p>産声を聞いた瞬間、涙が止まらなかった。小さな手を握られ、「この子のためにも、まだまだやらなきゃいけない」と心に誓った。子どもが増えた分、これからの生活費も増えていく。それでも、頑張る理由がはっきりした気がする。</p>" },
          { label: "試合に集中し、吉報を待つ", sub: "プロとして試合を優先し、報告を待つ",
            apply: function () { doBirth(); p.mental = clamp(p.mental + 3, 0, 99); },
            result: "<p>試合に集中し、終わってから改めて吉報を受け取った。ロッカーで写真を見せてもらい、チームメイトから祝福された。子どもが増えた分、これからの生活費も増えていく。家族のためにも、結果を出し続けなければ。</p>" }
        ]
      };
    }

    function injuryEvent() {
      var p = G.p;
      var part = p.type === "P" ? pick(["右肩", "右肘", "腰", "左肩", "右肘内側側副靱帯"]) : pick(["右膝", "左太もも裏", "腰", "右足首", "左肩"]);
      var sev = pick(["軽度", "中度", "重度"]);
      return {
        tag: "アクシデント", tagCls: "injury", title: part + "を痛めた",
        body: "<p>練習中、" + part + "に違和感を覚えた。病院での検査の結果は「" + (sev === "軽度" ? "筋肉の張り" : sev === "中度" ? "肉離れ・部分損傷" : "靱帯損傷の疑い") + "」。" + (sev === "重度" ? "ドクターからは手術も選択肢だと告げられた。" : "復帰まで数週間から1か月ほどかかる見込みだ。") + "</p><p>限りある現役生活で、時間は最も貴重な資源だ。どう向き合う？</p>",
        choices: [
          { label: "しっかり休んで完治を目指す", sub: "今季の出場は減るが、来季に万全で臨める",
            apply: function () { seasonCtx.perfMod = (seasonCtx.perfMod || 0) - (sev === "重度" ? 14 : 8); p.condition = clamp(p.condition + 12, 0, 99); p.mental = clamp(p.mental - 3, 0, 99); },
            result: "<p>焦る気持ちを抑え、リハビリに専念した。出場機会は減ったが、患部は確実に良くなっている。</p>" },
          { label: "痛み止めを打ちながら強行出場", sub: "アピールの機会は守れるが、悪化のリスクと隣り合わせ",
            apply: function () { var bad = chance(sev === "重度" ? 0.55 : 0.3); seasonCtx.perfMod = (seasonCtx.perfMod || 0) + (bad ? -16 : 2); if (bad) { p.condition = clamp(p.condition - 18, 0, 99); p.injuryProne = true; seasonCtx.injuryWorsened = true; } p.mental = clamp(p.mental + 2, 0, 99); },
            result: "" },
          { label: "手術を受けて根本治療する", sub: "今季はほぼ棒に振るが、来季以降の選手寿命は延びる（手術費がかかる）",

    function countPostSeasons() { return G.p.seasons.length - G.p.proYears; }

    function seasonFinance() {

    /* ---------------- post-season judgment ---------------- */

        if (chance(clamp(relP, 0.02, 0.95))) return secondRelease("npb");
        // 残留：年俸更新
        var newSal = Math.round(clamp(G.contractSalary * clamp(0.6 + perf / 90, 0.55, 1.9), 440, 30000) / 10) * 10;
        G.contractSalary = newSal; p.salary = newSal;

        p.age++;
        var html = '<div class="panel"><h2>来季も支配下契約</h2><div class="story">' +

        show(html, continueOrRetireActions());
        return;
      }
      if (G.phase === "ikusei") {

        else G.ikuseiGoodStreak = 0;
        var promP = perf >= 80 ? 0.55 : perf >= 70 ? 0.38 : perf >= 60 ? 0.20 : perf >= 50 ? 0.08 : 0.02;
        promP += Math.min(0.24, Math.max(0, (G.ikuseiGoodStreak || 0) - 1) * 0.08);
        promP *= clamp(1 - Math.max(0, p.age - 31) * 0.04, 0.5, 1);

        if (p.ability >= 75) promP += 0.05; else if (p.ability >= 65) promP += 0.03; else if (p.ability >= 58) promP += 0.015;
        // 経歴ボーナス：支配下経験と実績の蓄積
        var hasShihaiExp = (p.seasons || []).some(function (s) { return s.env === "npb"; }) || (G.shihaiSeasonsAfter || 0) >= 1 || G.npbReturnBest === "shihai";
        if (hasShihaiExp) promP += 0.04;
        if (p.record >= 65) promP += 0.03;
        promP = clamp(promP, 0, 0.85);
        var relYearAdd = (G.yearsInEnv >= 2 ? 0.16 : 0) + (G.yearsInEnv >= 4 ? 0.22 : 0);
        if (perf >= 60) relYearAdd *= 0.5; // 好成績のシーズンは年数による育成切りの増加を半分に
        var relP2 = (perf < 42 ? 0.4 : perf < 50 ? 0.18 : 0.06) + relYearAdd + Math.max(0, p.age - 31) * 0.03;
        if (chance(promP)) {
          p.age++;

    }

    function canHanamichi() {

      if (G.phase === "mlb" && G.mlbLevel === "MLB") return true;
      return false;
    }
    function continueOrRetireActions() {

        acts.push({ label: "引退の花道を選ぶ（引退セレモニー）", sub: "満員のスタンドと拍手に送られ、引退試合でユニフォームを脱ぐ", fn: function () { retire("hanamichi"); } });

    function secondLife() {
      var p = G.p;
      // 最後に所属したチーム（NPB／海外／独立）を seasons の後ろから拾う
      var lastNpbTeam = null, lastOverseasTeam = null, lastIndTeam = null;
      for (var si = p.seasons.length - 1; si >= 0; si--) {

        if (!ss.teamName) continue;

        if (!lastOverseasTeam && ss.env === "overseas") lastOverseasTeam = ss.teamName;
        if (!lastIndTeam && ss.env === "ind") lastIndTeam = ss.teamName;
      }
      if (!lastNpbTeam) lastNpbTeam = p.team.full;
      var pool = [];
      function add(label, desc, w) { pool.push({ label: label, desc: desc, w: Math.max(0.2, w) }); }
      add("NPBコーチ・指導者（" + teamShortOf(lastNpbTeam) + "）", "現役時代の実績と人望が認められ、" + lastNpbTeam + "のファームコーチに就任。ユニフォームを着続ける人生になった。", p.record * 0.5 + p.fame * 0.3 + (p.titles.length * 6) - 12);

      add("球団スタッフ（用具・打撃投手等）", "チームスタッフとして球団に残った。表舞台ではないが、野球と生き続ける。", 16);
      add("野球解説者・評論家", "注目度の高さが買われ、地方局やネット配信の解説者に。喋りの才能は予想外の武器になった。", p.fame * 0.55 + p.titles.length * 5 - 10);
      add(lastIndTeam ? "独立リーグの指導者（" + lastIndTeam + "）" : "独立リーグの指導者", "独立リーグのコーチに就任。自分と同じ境遇の若者を育てる仕事に、生きがいを見つけた。", 10 + (G.phaseHistoryInd ? 8 : 0));
      add("社会人野球の社員選手兼コーチ", "企業チームに社員として残り、選手兼コーチに。安定した生活と野球の両立が続いた。", 9);
      add("野球教室・アカデミーの指導者", "少年野球のアカデミーで指導者に。週末のグラウンドには、子どもたちの歓声が響く。", 13);
      add("プロ野球審判員", "審判学校に入り直し、ファームの試合から這い上がって審判員に。判定に文句を言われる側から、言う側へ――グラウンドに立ち続ける道を選んだ。", p.record * 0.2 + 6);
      add("高校野球の指導者", "教員免許を通信で取り直し、地元の高校で監督に就任。甲子園を目指す球児たちに、自分の失敗談まで全部さらけ出して伝える。", 9 + p.titles.length * 2);
      if (p.originKind === "大学") add("大学野球のコーチ", "母校の大学野球部コーチに就任。学生野球の清々しさに触れ、野球の原点を思い出した。", p.record * 0.25 + 5);
      add("野球系YouTuber・配信者", "現役時代の知名度を活かして動画配信を始めた。戦力外の裏側を語る動画がバズり、新しいファンが増えていく。", p.fame * 0.4 + 3);
      add("スポーツ用品メーカー社員", "現役時代に世話になった用具メーカーに就職。グラブやバットの開発に、選手目線の意見が重宝されている。", 7);
      add("タクシー運転手", "地元に戻り、タクシー運転手として第二の人生を送る。乗客に「あの選手ですよね」と声をかけられることもある。", 5);
      if (lastOverseasTeam) add("海外球団の駐在スカウト（" + lastOverseasTeam + "）", "現役時代にプレーした" + lastOverseasTeam + "の駐在スカウトに。異国で得た人脈と語学が、そのまま仕事になった。", 6);
      add("一般企業に就職", "スーツに袖を通し、営業職として再スタート。35歳の新人として、頭を下げる日々が始まった。", 17 - (p.age >= 35 ? 5 : 0));

      var total = pool.reduce(function (a, x) { return a + x.w; }, 0);
      var r = Math.random() * total;
      for (var i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) return pool[i]; }

    function retire(reason) {

      var life = secondLife();
      G.secondLife = life;
      var paperBody = [
        p.name + "選手（" + p.age + "）が" + dateStr() + "、現役引退を表明した。",

        "引退後は" + life.label + "としての道を歩むことが決まっている。"
      ];
      if (reason === "age40") paperBody.splice(1, 0, "40歳を迎えた時点で、NPBの支配下契約が手元にない。育成でも、独立リーグでも、海外でもない――支配下の契約だけが、40歳を超えてプレーを続ける資格だった。" + p.surname + "の長い挑戦は、年齢の壁の前で幕を閉じた。");
      if (reason === "hanamichi") paperBody.splice(1, 0, "引退試合には満員のファンが詰めかけ、最後の" + (p.type === "P" ? "登板" : "打席") + "では大歓声と拍手が鳴りやまなかった。試合後は花束が贈られ、チームメイトに胴上げされ、スタンドで見守る家族とともにファンへ別れの挨拶をした。戦力外通告から始まった野球人生は、誰もが羨む「花道」で幕を閉じた。");
      function proceedToPaper() {
        newspaper({
          date: dateStr(), good: reason === "hanamichi",

          subhead: reason === "hanamichi" ? "引退試合とセレモニー。戦力外から這い上がった男の、最高の終わり方" : reason === "age40" ? "40歳、支配下契約なし――年齢の壁の前にユニフォームを脱ぐ" : "プロ" + (p.proYears + countPostSeasons()) + "年、戦力外" + G.releases + "回を経験した野球人生に幕",
          body: paperBody,
          comment: reason === "hanamichi" ? pick([
            "こんな終わり方をさせてもらえるなんて、戦力外になったあの日は想像もできなかった。支えてくれた全ての人に感謝です",
            "最後の" + (p.type === "P" ? "マウンド" : "打席") + "、スタンドの景色は一生忘れません。最高の野球人生でした"
          ]) : pick([
            "悔いはあります。でも、やれることは全部やった。それだけは胸を張れます",
            "野球に育ててもらった人生でした。次は、自分が誰かを育てる番です",
            "応援してくれた家族とファンの皆さんに、感謝しかありません"
          ])
        }, function () { endingScreen(life); });
      }
      if (reason === "hanamichi") {
        // 引退試合・セレモニーの専用画面を挟んでから引退新聞へ
        var lastScene = p.type === "P" ? "最後の登板" : "最後の打席";
        var cerHtml;
        if (isMLBStage) {
          cerHtml = '<div class="panel"><h2>🌸 引退セレモニー ― ' + esc(G.teamName) + '</h2><div class="story">' +
            "<p>発表は突然だった。だが、当日のスタジアムは満員だった。" + p.age + "歳、元NPB戦力外選手がMLBの舞台で迎える、最後の試合。スタンドには日の丸を持ったファンの姿もあった。</p>" +

            "<p>試合後、監督とチームメイトから花束が贈呈され、" + p.surname + "はマウンド付近で胴上げされた。バックネット裏のスタンドでは、家族が見守っていた。あの戦力外の冬、一緒に泣いて、一緒に耐えた人たちだ。</p>" +
            "<p>最後の挨拶で彼は言った。「戦力外になったあの日、野球を辞めなくてよかった。今日の景色が、その答えです」。スタンドの拍手は、しばらく鳴りやまなかった。</p></div></div>";
        }
        show(cerHtml, [{ label: "セレモニーを見届ける", cls: "primary", fn: proceedToPaper }]);
        return;
      }
      proceedToPaper();

    function endingRank() {
      var p = G.p;
      var score = 0;
      if (G.npbReturnBest === "shihai") score += 42;
      else if (G.npbReturnBest === "ikusei") score += 20;
      score += G.comebacks * 8;
      score += clamp(G.shihaiSeasonsAfter * 4, 0, 14);
      score += p.titles.length * 4;
      score += clamp((p.age - 30) * 1.2, 0, 10);
      score += clamp(p.record * 0.12, 0, 12);
      if (G.mlbReached) score += 30; // MLB到達は最大級の加点
      if (G.endType === "hanamichi") score += 6; // 花道引退ボーナス
      if (G.secondLife && /コーチ・指導者|解説者/.test(G.secondLife.label)) score += 8;
      if (score >= 84) return "S";
      if (score >= 60) return "A";
      if (score >= 40) return "B";
      if (score >= 24) return "C";
      return "D";
    }
    function endingFrequency() {
      // 実データ（NPB進路調査2025・対象169人）に基づく頻度表示
      if (G.mlbReached) return { n: 1000, txt: "NPBで戦力外通告を受けた選手がMLBのグラウンドに立った例は、ほぼ前例がない" };
      if (G.npbReturnBest === "shihai") return { n: 17, txt: "支配下で現役続行できたのは169人中10人（5.9%）" };
      if (G.npbReturnBest === "ikusei") return { n: 4, txt: "育成契約でNPBに残れたのは169人中48人（28.4%）。ただし支配下までは届かなかった" };
      if (G.phaseHistoryOv || G.milestones.some(function (m) { return m.indexOf("海外") >= 0; })) return { n: 10, txt: "海外チームへ進んだのは169人中17人（10.1%）" };
      if (G.phaseHistoryInd) return { n: 21, txt: "独立リーグへ進んだのは169人中8人（4.7%）" };
      return { n: 3, txt: "戦力外・引退選手の多くは、数年のうちに野球の表舞台を去っていく" };
    }

    /* ---------------- SNS share ---------------- */
    var GAME_URL = "https://life-sim-games.github.io/baseball-life-sim/";
    function buildShareText(p, rank, life) {
      var years = p.proYears + countPostSeasons();

    /* ---------------- auto simulation (検証用) ---------------- */
    function autoSim(n) {
      SIM = true;
      var res = { runs: n, errors: 0, shihai: 0, ikuseiOnly: 0, anyNPB: 0, noReturn: 0, avgYears: 0, avgReleases: 0, secondRelease: 0, ranks: {}, furusatoUses: 0, furusatoRepeatRuns: 0, furusatoMaxPerTeam: 0 };
      for (var i = 0; i < n; i++) {
        try {
          beginCareer();
          var runFurusatoRepeat = false;
          var steps = 0;
          while (!G.retired && steps < 600) {
            steps++;
            if (!currentActions.length) throw new Error("no actions at step " + steps);
            var acts = currentActions;
            // 方針: 引退は晩年・低貯金時のみ時々選ぶ。それ以外はランダム
            var retireActs = acts.filter(function (a) { return /引退/.test(a.label) && !/まだ続ける/.test(a.label); });
            var others = acts.filter(function (a) { return retireActs.indexOf(a) < 0; });
            var chosen;
            var wantRetire = (G.p.age >= 40 && chance(0.5)) || (G.p.age >= 36 && chance(0.12)) || (G.p.savings < 0 && chance(0.4));
            if (wantRetire && retireActs.length && chance(0.6)) chosen = pick(retireActs);
            else chosen = others.length ? pick(others) : pick(acts);
            chosen.fn();
            if (G.furusatoIkuseiByTeam) {
              for (var fk in G.furusatoIkuseiByTeam) {
                var fc = G.furusatoIkuseiByTeam[fk];
                if (fc > res.furusatoMaxPerTeam) res.furusatoMaxPerTeam = fc;
                if (fc > 1) runFurusatoRepeat = true;
              }
            }
            if (G.p.age > 47) { retire("choice"); }
          }
          if (!G.retired) throw new Error("not retired after steps cap");
          if (runFurusatoRepeat) res.furusatoRepeatRuns++;
          res.furusatoUses += G.furusatoIkuseiTotal || 0;
          if (G.npbReturnBest === "shihai") res.shihai++;
          else if (G.npbReturnBest === "ikusei") res.ikuseiOnly++;
          else res.noReturn++;
          if (G.npbReturnBest) res.anyNPB++;
          if (G.releases >= 2) res.secondRelease++;
          res.avgYears += countPostSeasons();
          res.avgReleases += G.releases;
          var r = endingRank(); res.ranks[r] = (res.ranks[r] || 0) + 1;
        } catch (e) {
          res.errors++;
          if (res.errors <= 3) res["err" + res.errors] = String(e && e.message || e);
        }
      }
      res.avgYears = Math.round(res.avgYears / n * 100) / 100;
      res.avgReleases = Math.round(res.avgReleases / n * 100) / 100;
      res.shihaiPct = Math.round(res.shihai / n * 1000) / 10;
      res.anyNPBPct = Math.round(res.anyNPB / n * 1000) / 10;
      SIM = false;
      return res;
    }
    window.__sim = autoSim;

    /* ---------------- boot ---------------- */
    startScreen();
    </script>
